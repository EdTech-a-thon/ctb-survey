# nginx snippet for the CENTRAL host serving https://oauth.edtechathon.com
# Place inside the TLS server block for oauth.edtechathon.com.

server {
    listen 443 ssl;
    server_name oauth.edtechathon.com;

    # ssl_certificate ... ;  (managed by your platform / certbot)
    # ssl_certificate_key ... ;

    location / {
        proxy_pass http://127.0.0.1:4747;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
